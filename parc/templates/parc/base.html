{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestion Parking{% endblock %}</title>

  <!-- 1. Google Font (Style de écriture AdminLTE) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- 2. Font Awesome (Les icônes : voitures, clés, etc.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 3. Style AdminLTE Gratuit -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Barre du haut (Navbar) -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <span class="nav-link font-weight-LIGHT" style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; color:   #ff0000">LOGICIEL DE GESTION DU PARKING DE UCB</span>
      </li>
    </ul>
  </nav>

  <!-- Menu de gauche (Sidebar AdminLTE) -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link">
      <i class="fas fa-parking fa-2x ml-30 mr-1"></i>
      <span class="brand-text font-weight-bold" style="font-family: 'Times New Roman', Times, serif;">Parking Management</span>
    </a>

    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          
          <!-- Bouton Menu : Tableau de bord -->
          <li class="nav-item">
            <a href="#" class="nav-link active">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Tableau de bord</p>
            </a>
          </li>

          <!-- Bouton Menu : Véhicules -->
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="nav-icon fas fa-car"></i>
              <p>Véhicules Garés</p>
            </a>
          </li>

          <!-- Bouton Menu : Entrées / Sorties -->
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="nav-icon fas fa-ticket-alt"></i>
              <p>Tickets & Entrées</p>
            </a>
          </li>

        </ul>
      </nav>
    </div>
  </aside>

  <!-- Zone du contenu principal -->
  <div class="content-wrapper">
    <section class="content pt-3">
      <div class="container-fluid">
        <!-- C'est ici que s'affichera le contenu spécifique de chaque page -->
        {% block content %}
        {% endblock %}
      </div>
    </section>
  </div>

  <!-- Pied de page -->
  <footer class="main-footer">
    <strong>Copyright &copy; 2026 - Système de Parking.</strong> Tous droits réservés.
  </footer>

</div>

<!-- Scripts JS nécessaires pour AdminLTE -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
