{% extends 'parc/base.html' %}

{% block title %}Supprimer la place - Parking UCB{% endblock %}

{% block content %}
<div class="row mb-3">
  <div class="col-sm-6">
    <h1 class="m-0">Supprimer la place</h1>
  </div>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="card card-danger">
      <div class="card-header">
        <h3 class="card-title">
          <i class="fas fa-exclamation-triangle mr-1"></i> Confirmation de suppression
        </h3>
      </div>

      <div class="card-body">
        <p class="lead">Êtes-vous sûr de vouloir supprimer la place "{{ item }}" ?</p>
      </div>

      <div class="card-footer">
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="fas fa-trash mr-1"></i> Confirmer la suppression
          </button>
        </form>
        <a href="{% url 'placeparking_liste' %}" class="btn btn-secondary ml-2">
          ← Retour à la liste
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
