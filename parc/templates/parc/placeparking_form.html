{% extends 'parc/base.html' %}

{% block title %}{{ title|default:"Place de parking" }} - Parking UCB{% endblock %}

{% block content %}
<div class="row mb-3">
  <div class="col-sm-6">
    <h1 class="m-0">{{ title|default:"Gérer une place" }}</h1>
  </div>
</div>

<div class="row">
  <div class="col-md-8">
    <div class="card card-success">
      <div class="card-header">
        <h3 class="card-title"><i class="fas fa-square-parking mr-1"></i> {{ title|default:"Place" }}</h3>
      </div>
      
      <form method="post">
        {% csrf_token %}
        <div class="card-body">
          {{ form.as_p }}
        </div>
        <div class="card-footer">
          <button type="submit" class="btn btn-success">
            <i class="fas fa-save mr-1"></i> Enregistrer
          </button>
          <a href="{% url 'placeparking_liste' %}" class="btn btn-secondary ml-2">
            ← Retour à la liste
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
