<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des véhicules</title>
</head>
<body>
    <h1>Liste des véhicules</h1>

    <p><a href="{% url 'vehicule_creer' %}">Ajouter un véhicule</a></p>


    {% if vehicules %}
        <ul>
            {% for vehicule in vehicules %}
                <li>
                    {{ vehicule.marque }} {{ vehicule.modele }} - {{ vehicule.immatriculation }}
                    <a href="{% url 'vehicule_modifier' pk=vehicule.pk %}">Modifier</a>
                    <a href="{% url 'vehicule_supprimer' pk=vehicule.pk %}">Supprimer</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Aucun véhicule enregistré.</p>
    {% endif %}    
</body>
</html>
