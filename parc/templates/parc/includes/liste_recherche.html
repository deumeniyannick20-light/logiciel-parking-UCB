<div class="ucb-liste-recherche-bar" data-ucb-liste-recherche-bar>
  <button type="button" class="ucb-liste-recherche-loupe" aria-label="Ouvrir la recherche" title="Rechercher dans la liste">
    <i class="fas fa-search"></i>
  </button>
  <div class="ucb-liste-recherche-panel ucb-liste-recherche-panel--ferme">
    <div class="ucb-liste-recherche-champ">
      <i class="fas fa-search ucb-liste-recherche-icone" aria-hidden="true"></i>
      <input type="search"
             class="ucb-liste-recherche-input"
             placeholder="Rechercher dans la liste…"
             autocomplete="off"
             spellcheck="false"
             aria-label="Rechercher dans la liste">
      <button type="button" class="ucb-liste-recherche-fermer" aria-label="Fermer la recherche">&times;</button>
    </div>
    <ul class="ucb-liste-recherche-suggestions" role="listbox" hidden></ul>
    <p class="ucb-liste-recherche-vide" hidden>Aucun résultat ne correspond à votre recherche.</p>
  </div>
</div>
