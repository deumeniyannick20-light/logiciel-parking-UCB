
{% block content %}
  <h1>Supprimer le véhicule</h1>
  <p>Êtes-vous sûr de vouloir supprimer le véhicule "{{ vehicule }}" ?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
  </form>

  <p><a href="{% url 'vehicule_liste' %}">← Retour à la liste</a></p>
{% endblock %}
